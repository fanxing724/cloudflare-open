name = "ai-gateway"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI 绑定，在 dashboard 里勾选即可，无需额外 token
ai = { binding = "AI" }

# 鉴权 key 与可选的 CORS 白名单都用 secret 配置，不要写进本文件：
#   npx wrangler secret put API_KEY
#   npx wrangler secret put ALLOW_ORIGIN   # 例：https://a.example.com,https://b.example.com
